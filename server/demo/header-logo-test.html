<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Corporate Portal - Header Logo Test</title>
  <style>
    body { font-family: system-ui; background: #f8fafc; color: #1e293b; padding: 40px; }
    .card { background: white; max-width: 560px; margin: 0 auto; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
    .header-banner { background: #1e293b; padding: 24px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #3b82f6; }
    .header-logo { height: 50px; display: block; }
    .header-tagline { color: #94a3b8; font-size: 12px; }
    .content { padding: 30px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 13px; color: #64748b; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #1e293b; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-banner">
      <img src="company-logo.svg" id="header-logo" class="header-logo" alt="Acme Corp Brand Logo">
      <div class="header-tagline">Secure Enterprise Gateway</div>
    </div>
    <div class="content">
      <h1>Partner Access Portal</h1>
      <p>Please enter your corporate authorization credentials.</p>

      <div class="form-group">
        <label for="company_id">Partner Organization Code</label>
        <input type="text" id="company_id" name="company_id" placeholder="CORP-88421">
      </div>

      <div class="form-group">
        <label for="admin_email">Administrator Email</label>
        <input type="email" id="admin_email" name="admin_email" placeholder="admin@partner.com">
      </div>

      <button type="button" id="login-btn">Authenticate Partner</button>
    </div>
  </div>
</body>
</html>
