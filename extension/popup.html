<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Agent: Precision Redaction</title>
    <style>
      /* ── Clinical Reset ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 480px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f8f9fa;
        color: #212529;
        padding: 16px;
        border-top: 4px solid #343a40;
      }

      /* ── Header & Icon ── */
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 12px;
      }
      .icon {
        width: 32px; height: 32px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      /* SVG Eye with strike */
      .icon svg { width: 28px; height: 28px; fill: #212529; }
      
      header h1  { font-size: 14px; font-weight: 600; color: #212529; text-transform: uppercase; letter-spacing: 0.5px; }
      header p   { font-size: 11px; color: #6c757d; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      /* ── Pipeline Strip ── */
      .pipeline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        position: relative;
      }
      .pipeline::before {
        content: "";
        position: absolute;
        top: 50%; left: 0; right: 0;
        height: 1px;
        background: #dee2e6;
        z-index: 1;
      }
      .stage {
        background: #f8f9fa;
        padding: 4px 8px;
        color: #adb5bd;
        border: 1px solid #dee2e6;
        z-index: 2;
        border-radius: 2px;
        transition: all 0.2s ease;
      }
      .stage.active {
        background: #f59e0b;
        color: #fff;
        border-color: #d97706;
        font-weight: bold;
      }
      .stage.done {
        color: #495057;
        border-color: #ced4da;
      }

      /* ── Inputs & Buttons ── */
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px;
        border-radius: 2px;
        border: 1px solid #ced4da;
        background: #fff;
        color: #212529;
        font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #f59e0b;
      }
      
      .btn-row { display: flex; gap: 8px; }
      button {
        flex: 1;
        padding: 10px 0;
        border: 1px solid #343a40;
        border-radius: 2px;
        background: #fff;
        color: #343a40;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.1s;
      }
      button:hover:not(:disabled) {
        background: #f8f9fa;
      }
      button:active:not(:disabled) {
        background: #e9ecef;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #analyzeBtn { background: #343a40; color: #fff; }
      #analyzeBtn:hover:not(:disabled) { background: #212529; }
      #demoBtn { background: #fff; color: #343a40; }

      /* ── Status & Technical Data ── */
      #statusText {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        color: #495057;
        padding: 8px;
        background: #e9ecef;
        border: 1px solid #ced4da;
        border-radius: 2px;
        margin-bottom: 12px;
        display: none;
      }
      #statusText.error { background: #fef2f2; color: #b91c1c; border-color: #fca5a5; }

      /* ── Progress Bar ── */
      #modelLoadWrap {
        display: none;
        margin-bottom: 12px;
        background: #fff;
        padding: 12px;
        border: 1px solid #ced4da;
        border-radius: 2px;
      }
      #modelLoadWrap .label {
        display: flex; justify-content: space-between;
        font-size: 10px; color: #495057; margin-bottom: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        text-transform: uppercase;
      }
      progress {
        width: 100%; height: 4px; border: none;
        background: #e9ecef;
      }
      progress::-webkit-progress-bar { background: #e9ecef; }
      progress::-webkit-progress-value { background: #f59e0b; transition: width 0.1s; }

      /* ── Canvas wrapper ── */
      #canvasWrap {
        display: none;
        margin-bottom: 12px;
        border: 1px solid #ced4da;
        background: #e9ecef;
      }
      #debugCanvas {
        width: 100%;
        display: block;
      }

      /* ── PII Data Table (Monospace) ── */
      #piiTable {
        display: none;
        background: #fff;
        border: 1px solid #ced4da;
        border-radius: 2px;
        margin-bottom: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
      }
      #piiTable table {
        width: 100%; border-collapse: collapse; text-align: left;
      }
      #piiTable th, #piiTable td {
        padding: 6px 8px; border-bottom: 1px solid #e9ecef;
      }
      #piiTable th { background: #f8f9fa; font-weight: normal; color: #6c757d; }

      /* ── Legend ── */
      #legend {
        display: none;
        gap: 12px;
        font-size: 10px;
        color: #495057;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .legend-item { display: flex; align-items: center; gap: 4px; }
      .swatch {
        width: 10px; height: 10px; flex-shrink: 0; border: 1px solid #adb5bd;
      }
      .swatch.region { background: #22c55e; }
      .swatch.text   { background: #60a5fa; }
    </style>
  </head>
  <body>
    <header>
      <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <!-- Eye with redaction strike -->
          <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" opacity="0.3"/>
          <path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" opacity="0.3"/>
          <rect x="2" y="10" width="20" height="4" fill="#f59e0b" />
        </svg>
      </div>
      <div>
        <h1>Redaction Agent</h1>
        <p>FLORENCE-2 / LOCAL WEBGPU</p>
      </div>
    </header>

    <div class="pipeline">
      <div class="stage" id="stage-capture">CAP</div>
      <div class="stage" id="stage-detect">DET</div>
      <div class="stage" id="stage-redact">RED</div>
      <div class="stage" id="stage-send">SND</div>
      <div class="stage" id="stage-act">ACT</div>
    </div>

    <div class="control-group">
      <input type="text" id="taskInput" placeholder="CMD: e.g. fill out signup form">
      <div class="btn-row">
        <button id="analyzeBtn">Execute</button>
        <button id="demoBtn">Demo Mode</button>
      </div>
    </div>

    <div id="modelLoadWrap">
      <div class="label">
        <span id="modelLoadFile">Loading model dependency</span>
        <span id="modelLoadPct">0%</span>
      </div>
      <progress id="modelLoadProgress" value="0" max="100"></progress>
    </div>

    <div id="statusText">System idle.</div>

    <div id="canvasWrap">
      <canvas id="debugCanvas"></canvas>
    </div>

    <div id="piiTable"></div>

    <div id="legend">
      <div class="legend-item"><div class="swatch region"></div><span>OD</span></div>
      <div class="legend-item"><div class="swatch text"></div><span>OCR</span></div>
      <div class="legend-item"><div class="swatch" style="background:#ef4444"></div><span>PASS</span></div>
      <div class="legend-item"><div class="swatch" style="background:#f97316"></div><span>EMAIL</span></div>
      <div class="legend-item"><div class="swatch" style="background:#eab308"></div><span>PHONE</span></div>
      <div class="legend-item"><div class="swatch" style="background:#ec4899"></div><span>CARD</span></div>
      <div class="legend-item"><div class="swatch" style="background:#06b6d4"></div><span>FACE</span></div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
